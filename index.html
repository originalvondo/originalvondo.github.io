<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OriginalVondo</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/originalvondo/originalvondo.github.io/main/media/images/favicon(16x16).jpg">
    <!-- Google Fonts for editorial serifs and monospace aesthetics -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
    <link rel="preload" as="audio" href="https://originalvondo.github.io/media/music/hooper/Heaven%20sent.mp3">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- JSMediaTags library CDN (to parse embedded metadata like title, artist, cover from MP3s) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="grid-background"></div>

    <div class="texture-overlay"></div>

    <main class="container">

        <nav class="navbar">
            <div class="nav-logo" onclick="window.location.hash = 'home'">vondo // original</div>
            <div class="nav-links">
                <a href="#home" class="nav-item active" data-target="home">Home</a>
                <a href="#about" class="nav-item" data-target="about">Memory</a>
                <a href="#archive" class="nav-item" data-target="archive">Archive</a>
                <a href="#music" class="nav-item" data-target="music">Playlist</a>
            </div>
        </nav>

        <div id="content-area">
            <div class="route-loading mono-text">loading...</div>
        </div>

    </main>

    <div id="lightbox" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content-box">
            <img class="lightbox-img" id="lightbox-img" src="" alt="Zoomed image">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
